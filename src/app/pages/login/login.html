<div class="login">
  <div class="login__panel">
    <div class="login__brand">
      <span class="login__mark" aria-hidden="true"></span>
      <div>
        <p class="login__eyebrow">{{ portal.fornecedor }}</p>
        <h1 class="login__title">{{ portal.produto }}</h1>
        <p class="login__tagline">{{ portal.tagline }}</p>
      </div>
    </div>

    <p class="login__project">
      Acesso ao acompanhamento de
      <strong>{{ projetoInfo.nome }}</strong>
      · {{ projetoInfo.cliente }}
    </p>

    <form class="login__form" (ngSubmit)="onSubmit()" autocomplete="on">
      <label class="login__field">
        <span>Usuário</span>
        <input
          type="text"
          name="usuario"
          [(ngModel)]="usuario"
          required
          autofocus
          autocomplete="username"
          placeholder="Digite seu usuário"
        />
      </label>

      <label class="login__field">
        <span>Senha</span>
        <div class="login__password">
          <input
            [type]="senhaVisivel() ? 'text' : 'password'"
            name="senha"
            [(ngModel)]="senha"
            required
            autocomplete="current-password"
            placeholder="Digite sua senha"
          />
          <button
            type="button"
            class="login__toggle"
            (click)="alternarSenha()"
            [attr.aria-label]="senhaVisivel() ? 'Ocultar senha' : 'Mostrar senha'"
            [attr.aria-pressed]="senhaVisivel()"
            [title]="senhaVisivel() ? 'Ocultar senha' : 'Mostrar senha'"
          >
            @if (senhaVisivel()) {
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </div>
      </label>

      @if (erro()) {
        <p class="login__error" role="alert">Usuário ou senha inválidos.</p>
      }

      <button type="submit" class="login__submit" [disabled]="submetendo()">
        Entrar
      </button>
    </form>

    <p class="login__hint">Acesso restrito a usuários autorizados do projeto.</p>
  </div>
</div>
